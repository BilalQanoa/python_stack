<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Counter Assignment</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .counter-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .count-display { font-size: 3rem; font-weight: bold; color: #007bff; }
    </style>
</head>
<body>
    <div class="container text-center">
        <div class="counter-box mx-auto" style="max-width: 500px;">
            <div class="row mb-4">
                <div class="col-6 border-right">
                    <h5 class="text-muted">Counter</h5>
                    <p class="count-display mb-0">{{ session['count'] }}</p>
                </div>
                <div class="col-6">
                    <h5 class="text-muted">Page Visits</h5>
                    <p class="count-display mb-0 text-success">{{ session['visits'] }}</p>
                </div>
            </div>

            <div class="d-flex justify-content-center gap-2 mb-3">
                <a href="/add_two" class="btn btn-primary mr-2">+2 Button</a>
                <a href="/reset" class="btn btn-warning mr-2">Reset Counter</a>
                <a href="/destroy_session" class="btn btn-danger">Destroy Session</a>
            </div>

            <hr>
            
            <form action="/custom_increment" method="post" class="mt-3">
                <div class="form-group">
                    <label>Set Custom Increment:</label>
                    <input type="number" name="increment" class="form-control" placeholder="Enter number">
                </div>
                <button type="submit" class="btn btn-success btn-block">Increment</button>
            </form>
        </div>
    </div>
</body>
</html>
